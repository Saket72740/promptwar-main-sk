<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wellness Tracker - Application Error</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #090e1a 0%, #0d1527 50%, #16223f 100%);
            --glass-bg: rgba(13, 21, 39, 0.7);
            --glass-border: rgba(255, 255, 255, 0.08);
            
            --primary: #6366f1; /* Indigo */
            --danger: #f43f5e; /* Rose */
            
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            
            --font-display: 'Outfit', sans-serif;
            --font-body: 'Plus Jakarta Sans', sans-serif;
            
            --radius-md: 16px;
            --transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            background: var(--bg-gradient);
            color: var(--text-main);
            font-family: var(--font-body);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1.6;
        }

        .glow-blob {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 50vw;
            height: 50vw;
            background: radial-gradient(circle, rgba(244, 63, 94, 0.08) 0%, transparent 70%);
            z-index: -1;
            pointer-events: none;
            filter: blur(80px);
        }

        .error-card {
            background: var(--glass-bg);
            border: 1px solid rgba(244, 63, 94, 0.15);
            border-radius: var(--radius-md);
            padding: 3rem;
            max-width: 550px;
            width: 90%;
            text-align: center;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }

        .error-icon {
            font-size: 4rem;
            color: var(--danger);
            margin-bottom: 1.5rem;
            text-shadow: 0 0 15px rgba(244, 63, 94, 0.4);
        }

        h1 {
            font-family: var(--font-display);
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 1rem;
            letter-spacing: -0.5px;
        }

        p {
            font-size: 0.95rem;
            color: var(--text-muted);
            margin-bottom: 2rem;
        }

        .error-detail {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--glass-border);
            padding: 1rem;
            border-radius: 8px;
            font-family: monospace;
            font-size: 0.85rem;
            color: #fda4af;
            text-align: left;
            margin-bottom: 2rem;
            word-break: break-word;
            max-height: 120px;
            overflow-y: auto;
        }

        .btn-home {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: var(--primary);
            color: var(--text-main);
            text-decoration: none;
            padding: 0.8rem 1.75rem;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.95rem;
            transition: var(--transition);
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.2);
        }

        .btn-home:hover {
            background: #4f46e5;
            box-shadow: 0 4px 20px rgba(99, 102, 241, 0.45);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="glow-blob"></div>

    <div class="error-card">
        <div class="error-icon">
            <i class="fa-solid fa-triangle-exclamation"></i>
        </div>
        <h1>An Error Occurred</h1>
        <p>Something went wrong with the digital companion analytics. Don't worry, your progress has not been lost.</p>
        
        <div class="error-detail" th:text="${errorMessage}">
            Detailed exception details go here...
        </div>

        <a href="/" class="btn-home">
            <i class="fa-solid fa-house-medical"></i> Return to Dashboard
        </a>
    </div>

</body>
</html>
